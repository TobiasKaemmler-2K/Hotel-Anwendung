<section class="page account-page">
  <article class="card account-card">
    <h2>Passwort zuruecksetzen</h2>
    <p class="hint">Prototyp: Es wird keine echte E-Mail versendet.</p>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <label>
        E-Mail
        <input type="email" formControlName="email" />
      </label>

      <button class="action-button" type="submit">Reset-Link anfordern</button>
    </form>

    <p class="success" *ngIf="resetSent">Wenn ein Konto existiert, wurde ein Reset-Link vorbereitet.</p>
    <a routerLink="/account/login">Zurueck zum Login</a>
  </article>
</section>
